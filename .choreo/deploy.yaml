version: 1
metadata:
  name: Meeting Room Booking App
  description: Full-stack meeting room booking application
  organization: Meeting Room Booking

services:
  - name: backend-api
    type: service
    source:
      type: github
      path: ./backend
    dockerfile: Dockerfile
    port: 8080
    environment:
      - name: SUPABASE_DB_URL
        valueFrom:
          secretKeyRef:
            name: supabase-credentials
            key: db-url
      - name: JWT_SECRET
        value: "meeting-room-booking-jwt-secret-2024"
      - name: API_KEY
        value: "my-secret-api-key"
      - name: PORT
        value: "8080"
    endpoints:
      - name: api
        basePath: /
        port: 8080
        scheme: http
    resources:
      requests:
        memory: 256Mi
        cpu: 250m
      limits:
        memory: 512Mi
        cpu: 500m
    replicas:
      min: 1
      max: 3

  - name: frontend-web
    type: web
    source:
      type: github
      path: ./frontend
    buildCommand: flutter build web
    port: 80
    resources:
      requests:
        memory: 256Mi
        cpu: 250m
      limits:
        memory: 512Mi
        cpu: 500m
    replicas:
      min: 1
      max: 2
    environment:
      - name: API_BASE_URL
        value: "https://backend-api.{choreo-domain}/api"

dependencies:
  - source: backend-api
    target: frontend-web
    type: http
