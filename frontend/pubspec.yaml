name: meeting_room_booking
description: Office Meeting Room Booking App - A simple CRUD app for managing meeting room bookings.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # HTTP client for making API calls
  http: ^1.2.0
  
  # Date formatting utilities
  intl: ^0.20.2
  
  # Loading spinner animations
  flutter_spinkit: ^5.2.1
  
  # Icons
  cupertino_icons: ^1.0.6
  
  # Local data persistence (for JWT token storage)
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png
